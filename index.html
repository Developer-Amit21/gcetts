<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>College Portal Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <h1> Government College of Engineering and Textile Technology, Serampore(GCETTS)</h1>

        <form id="loginForm" onsubmit="event.preventDefault(); login();">
            <label for="username">Username:</label>
            <input type="text" id="username" placeholder="Enter username">

            <label for="password">Password:</label>
            <input type="password" id="password" placeholder="Enter password">

            <label for="role">Select Role:</label>
            <select id="role">
                <option value="">--Select Role--</option>
                <option value="student">Student</option>
                <option value="teacher">Teacher</option>
                <option value="faculty">Faculty</option>
                <option value="exam">Exam Portal</option>
                <option value="result">Result Portal</option>
            </select>

            <button type="submit">Login</button>
        </form>

        <p id="loginMsg"></p>
    </div>

    <script>
        function login() {
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();
            const role = document.getElementById("role").value;

            const msg = document.getElementById("loginMsg");

            if (!username || !password || !role) {
                msg.style.color = "red";
                msg.textContent = "All fields are required!";
                return;
            }

            // Simple frontend login simulation
            // You can replace this with real backend authentication later
            let portal = "";
            switch(role) {
                case "student": portal = "student/student.html"; break;
                case "teacher": portal = "teacher/teacher.html"; break;
                case "faculty": portal = "faculty/faculty.html"; break;
                case "exam": portal = "exam_portal/exam.html"; break;
                case "result": portal = "exam_portal/result.html"; break;
                default: portal = ""; break;
            }

            if (portal) {
                msg.style.color = "green";
                msg.textContent = "Login successful! Redirecting...";
                setTimeout(() => {
                    window.location.href = portal;
                }, 1000);
            } else {
                msg.style.color = "red";
                msg.textContent = "Invalid role selected!";
            }
        }
    </script>
</body>
</html>
